company: Stripe
title: Backend Engineer
portal_url: https://stripe.com/jobs/listing/backend-engineer
description: |
  Stripe is looking for a Backend Engineer to design and build APIs that
  move money. You will work in Python and TypeScript, own services end to
  end, and care about reliability, observability, and clear interfaces.

  Responsibilities:
  - Design and ship backend services used by millions of businesses
  - Improve reliability and performance of existing payment APIs
  - Collaborate with product and infrastructure teams

  Requirements:
  - Experience building production backend systems
  - Comfortable with Python or a similar language
  - Strong communication and written design skills
