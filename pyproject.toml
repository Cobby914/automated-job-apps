[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobapps"
version = "0.1.0"
description = "Watch a jobs folder and generate tailored LaTeX/PDF resumes and cover letters"
requires-python = ">=3.11"
dependencies = [
  "cursor-sdk",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.4",
  "watchdog>=4.0.0",
  "notion-client>=2.2.1",
  "pydantic>=2.7.0",
  "openai>=1.40.0",
  "anthropic>=0.34.0",
]

[project.scripts]
jobapps = "jobapps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
