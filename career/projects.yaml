- id: smart-step
  name: Smart Step
  url: ""
  tracks: [ai, default]
  tags: [embedded, sensors, assistive, hardware, cloud]
  domains: [embedded, accessibility, iot]
  technologies:
    - C
    - PlatformIO
    - Arduino
    - ESP32
    - AWS
    - Ultrasonic Sensors
    - Time-of-Flight Sensors
    - Sensor Integration
  stack: C, PlatformIO, Arduino, ESP32, AWS
  summary: >
    Developed an assistive embedded system to help visually impaired users detect
    obstacles and elevation changes using C, PlatformIO, Arduino/ESP32, ultrasonic
    and time-of-flight sensors, and AWS. Processed sensor readings to trigger
    buzzer feedback and relayed data from the ESP32 to AWS for a Bluetooth/voice
    feature. Debugged physical hardware directly.
  facts:
    - id: smart-step.fact.1
      text: Developed an assistive embedded system designed to help visually impaired users detect obstacles and elevation changes.
    - id: smart-step.fact.2
      text: Built the device using C, PlatformIO, Arduino/ESP32, ultrasonic sensors, time-of-flight sensing, and AWS.
    - id: smart-step.fact.3
      text: Sensor readings were processed to identify incoming objects and terrain changes and trigger feedback for the user.
    - id: smart-step.fact.4
      text: Worked directly with physical hardware debugging and developed cloud/Bluetooth functionality through the ESP32.
  metrics:
    - id: smart-step.metric.1
      kind: absolute
      text: Approximately 80% obstacle/elevation detection accuracy (absolute accuracy, not an 80% relative gain).
    - id: smart-step.metric.2
      kind: absolute
      text: Approximately 90% accuracy for the Bluetooth/voice feature in trials (absolute accuracy).
  bullets:
    - id: smart-step.bullet.1
      text: Created a smart white cane detecting elevation changes and incoming objects using T.O.F and ultrasonic sensors.
      sources: [smart-step.fact.1, smart-step.fact.2]
    - id: smart-step.bullet.2
      text: Developed a buzzer feedback system for visually impaired users from sensor inputs with low-latency physical testing.
      sources: [smart-step.fact.3]
    - id: smart-step.bullet.3
      text: Relayed data from ESP32 to AWS cloud for a Bluetooth voice feature with approximately 90% accuracy in trials.
      sources: [smart-step.fact.4, smart-step.metric.2]
    - id: smart-step.bullet.4
      text: "Stack: C, PlatformIO, Arduino, ESP32, AWS."
      sources: []

