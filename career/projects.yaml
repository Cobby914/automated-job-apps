- id: genome-sequencing
  name: Genome Sequencing
  url: ""
  tracks: [swe, ai, default]
  tags: [ml, data-pipeline, research, classification]
  domains: [bioinformatics, machine-learning]
  technologies:
    - Python
    - DuckDB
    - pandas
    - PyTorch
    - scikit-learn
    - Matplotlib
  stack: Python, DuckDB, pandas, PyTorch, scikit-learn
  summary: >
    Built a machine-learning and data-engineering pipeline for genetic variant
    classification using Python, DuckDB, pandas, PyTorch, and scikit-learn.
    Combined the Humsavar and dbNSFP 5.3a datasets, then trained neural-network
    classification models. Improving the dataset and feature pipeline raised
    downstream F1 substantially without relying only on architecture changes.
  facts:
    - id: genome-sequencing.fact.1
      text: Built a machine-learning and data-engineering pipeline for genetic variant classification using Python, DuckDB, pandas, PyTorch, and scikit-learn.
    - id: genome-sequencing.fact.2
      text: Combined the Humsavar and dbNSFP 5.3a datasets with joining, transformation, preprocessing, and exploratory analysis.
    - id: genome-sequencing.fact.3
      text: Trained neural-network classification models on the resulting dataset.
    - id: genome-sequencing.fact.4
      text: Demonstrated that improving the underlying dataset and feature pipeline could materially improve downstream model performance rather than relying solely on architecture changes.
  metrics:
    - id: genome-sequencing.metric.1
      kind: absolute
      text: Improved classification F1 from approximately 0.40 to 0.70 (absolute F1 scores).
  bullets:
    - id: genome-sequencing.bullet.1
      text: Constructed a pipeline conjoining Humsavar and dbNSFP using DuckDB and pandas, raising F1 from 0.40 to 0.70.
      sources: [genome-sequencing.fact.2, genome-sequencing.metric.1]
    - id: genome-sequencing.bullet.2
      text: Contributed data exploration using pandas and Matplotlib, increasing data readability for model tuning.
      sources: [genome-sequencing.fact.2]
    - id: genome-sequencing.bullet.3
      text: Developed a neural network learner using Python, PyTorch, pandas, and scikit-learn with an F1 of 0.70.
      sources: [genome-sequencing.fact.3, genome-sequencing.metric.1]
    - id: genome-sequencing.bullet.4
      text: "Stack: Python, DuckDB, pandas, PyTorch, scikit-learn."
      sources: []

- id: tumor-classification
  name: Tumor Classification based Scans
  url: ""
  tracks: [swe, ai, default]
  tags: [ml, computer-vision, explainability, medical]
  domains: [healthcare, machine-learning]
  technologies:
    - Python
    - PyTorch
    - scikit-learn
    - pandas
    - Matplotlib
    - Grad-CAM
    - Deep Learning
    - Computer Vision
  stack: Python, PyTorch, scikit-learn, pandas
  summary: >
    Developed a deep-learning pipeline for classifying tumors from medical scan
    data using Python, PyTorch, scikit-learn, and pandas. Built a residual
    neural-network architecture, ran systematic hyperparameter/grid-search
    experimentation, and implemented Grad-CAM to inspect which image regions
    influenced predictions.
  facts:
    - id: tumor-classification.fact.1
      text: Developed a deep-learning pipeline for classifying tumors from medical scan data using Python, PyTorch, scikit-learn, and pandas.
    - id: tumor-classification.fact.2
      text: Built a residual neural-network architecture and performed systematic hyperparameter experimentation.
    - id: tumor-classification.fact.3
      text: Implemented Grad-CAM to investigate which portions of medical images influenced model predictions.
  metrics:
    - id: tumor-classification.metric.1
      kind: absolute
      text: Achieved an absolute F1 score of approximately 0.99 (99% F1), not a 99% relative improvement.
    - id: tumor-classification.metric.2
      kind: relative
      text: Hyperparameter/grid-search optimization improved residual-network F1 by approximately 30% relative to the untuned baseline.
    - id: tumor-classification.metric.3
      kind: absolute
      text: Grad-CAM analysis reached approximately 0.67 spatial correlation.
  bullets:
    - id: tumor-classification.bullet.1
      text: Created a residual neural network using scikit-learn, PyTorch, and Python with an F1 score of roughly 99%.
      sources: [tumor-classification.fact.2, tumor-classification.metric.1]
    - id: tumor-classification.bullet.2
      text: Implemented a grid search using pandas, Matplotlib, and PyTorch, improving residual-network F1 by 30% vs the untuned baseline.
      sources: [tumor-classification.fact.2, tumor-classification.metric.2]
    - id: tumor-classification.bullet.3
      text: Implemented Grad-CAM for the residual neural network using PyTorch, reaching a spatial correlation of 0.67.
      sources: [tumor-classification.fact.3, tumor-classification.metric.3]
    - id: tumor-classification.bullet.4
      text: "Stack: Python, PyTorch, scikit-learn, pandas."
      sources: []

- id: canvas-notion
  name: Canvas-Notion
  url: ""
  tracks: [swe, ai, default]
  tags: [automation, apis, data-pipeline, backend]
  domains: [productivity, education]
  technologies:
    - Python
    - Canvas API
    - Notion API
    - GitHub Actions
    - REST APIs
  stack: Python, Canvas API, Notion API, GitHub Actions
  summary: >
    Built a Python synchronization engine that automatically transfers assignments
    and task information from Canvas LMS into Notion. Integrated both REST APIs,
    added heuristics for task priority and effort, implemented idempotent sync
    using Canvas Assignment IDs, and scheduled runs with GitHub Actions.
  facts:
    - id: canvas-notion.fact.1
      text: Built a Python synchronization engine that automatically transfers assignments and task information from Canvas LMS into Notion.
    - id: canvas-notion.fact.2
      text: Integrated the Canvas and Notion REST APIs and created a metadata-processing pipeline that translated assignment information into Notion tasks.
    - id: canvas-notion.fact.3
      text: Added custom heuristics for estimating task priority and effort.
    - id: canvas-notion.fact.4
      text: Implemented idempotent synchronization using Canvas Assignment IDs so repeated executions updated existing tasks rather than producing duplicates.
    - id: canvas-notion.fact.5
      text: Used GitHub Actions to automate execution so the synchronization workflow could run without manual intervention.
  metrics: []
  bullets:
    - id: canvas-notion.bullet.1
      text: Made a Python sync engine to automate Canvas-to-Notion task tracking, using REST APIs and GitHub Actions.
      sources: [canvas-notion.fact.1, canvas-notion.fact.5]
    - id: canvas-notion.bullet.2
      text: Engineered metadata transformation pipeline to calculate task priority and effort using custom heuristics.
      sources: [canvas-notion.fact.2, canvas-notion.fact.3]
    - id: canvas-notion.bullet.3
      text: Implemented idempotent logic with Canvas Assignment IDs to ensure consistency and prevent duplicate entries.
      sources: [canvas-notion.fact.4]
    - id: canvas-notion.bullet.4
      text: "Stack: Python, Canvas API, Notion API, GitHub Actions."
      sources: []

