- id: unity-rl
  name: Unity Reinforcement Learning
  url: ""
  tracks: []
  tags: [rl, simulation, ml, games]
  domains: [reinforcement-learning, simulation]
  technologies:
    - Unity
    - Unity ML-Agents
    - PPO
    - C#
    - TensorBoard
    - Reinforcement Learning
  stack: Unity ML-Agents, PPO, C#, TensorBoard
  summary: >
    Built and trained a physics-based reinforcement-learning agent using Unity
    ML-Agents, PPO, C#, and TensorBoard. Used curriculum learning from balance
    through locomotion, target navigation, block pushing, and self-play. Diagnosed
    reward hacking such as sliding and crawling, and iterated rewards until
    locomotion stabilized.
  facts:
    - id: unity-rl.fact.1
      text: Built and trained a physics-based reinforcement-learning agent using Unity ML-Agents, PPO, C#, and TensorBoard.
    - id: unity-rl.fact.2
      text: Used curriculum learning progressing through balance, locomotion, target navigation, block pushing, and opponent/self-play.
    - id: unity-rl.fact.3
      text: Worked with a ragdoll-like agent containing numerous independently controlled joints and a large continuous observation/action space.
    - id: unity-rl.fact.4
      text: Diagnosed reward hacking including sliding, crawling, falling sideways, and other strategies that increased reward while failing intended locomotion.
  metrics:
    - id: unity-rl.metric.1
      kind: count
      text: Controlled approximately 16 articulated joints.
    - id: unity-rl.metric.2
      kind: count
      text: Stable locomotion required 45M+ training steps.
    - id: unity-rl.metric.3
      kind: count
      text: Later self-play experimentation ran for approximately 25M steps.
  bullets:
    - id: unity-rl.bullet.1
      text: Refined PPO rewards for a Unity humanoid agent controlling 16 articulated joints.
      sources: [unity-rl.fact.1, unity-rl.metric.1]
    - id: unity-rl.bullet.2
      text: Integrated joint rotations, velocities, targets, and arena boundaries into RL observations.
      sources: [unity-rl.fact.3]
    - id: unity-rl.bullet.3
      text: Diagnosed crawling, sliding, and balancing reward hacks during PPO training.
      sources: [unity-rl.fact.4]
    - id: unity-rl.bullet.4
      text: Contributed to stable locomotion after 45M+ Unity ML-Agents training steps.
      sources: [unity-rl.metric.2]
    - id: unity-rl.bullet.5
      text: Trained self-play policies for approximately 25M additional environment steps.
      sources: [unity-rl.metric.3]
    - id: unity-rl.bullet.6
      text: Analyzed training behavior with TensorBoard to identify reward and locomotion failures.
      sources: [unity-rl.fact.1]
    - id: unity-rl.bullet.7
      text: "Stack: Unity ML-Agents, PPO, C#, TensorBoard."
      sources: []

