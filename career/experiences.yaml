- id: uci-scalesense
  company: University of California, Irvine
  role: Undergraduate Research Assistant
  location: Irvine, CA
  start: Dec. 2025
  end: Present
  section: research
  tracks: [swe, ai, default]
  tags:
    - computer-vision
    - autonomy
    - simulation
    - sensor-fusion
    - data-pipeline
    - radar
    - research
  domains: [autonomous-systems, robotics, research]
  technologies:
    - Python
    - PyTorch
    - CARLA
    - SUMO
    - Linux
    - PointNet
    - RadarGNN
  summary: >
    Designed and built ScaleSense, a CARLA/SUMO digital-twin framework in Python
    and PyTorch that advances synchronous simulation ticks to keep multi-radar
    and camera capture race-free, tests roadside radar layouts and positions for
    more optimal placement, and evaluates perception models on the resulting data.
  facts:
    - id: uci-scalesense.fact.1
      text: "Designed the ScaleSense framework architecture end-to-end, including configurable radar layouts, CARLA-SUMO integration, synchronized capture, offline labeling, post-processing, and campaign execution."
    - id: uci-scalesense.fact.2
      text: "Research goal is testing different roadside radar layouts and positions to identify more optimal radar placement."
    - id: uci-scalesense.fact.3
      text: "Built an end-to-end CARLA and SUMO radar-camera dataset-generation framework in Python on Linux."
    - id: uci-scalesense.fact.4
      text: "Advanced CARLA in synchronous simulation ticks so radar measurements, camera frames, and actor ground truth share consistent frame identifiers."
    - id: uci-scalesense.fact.5
      text: "Identified and resolved race conditions caused by asynchronous simulation ticks during multi-sensor capture and CARLA-SUMO bridging."
    - id: uci-scalesense.fact.6
      text: "Built configurable sensor-layout and campaign-execution tooling for synchronized radar, camera, and calibration captures."
    - id: uci-scalesense.fact.7
      text: "Built offline oriented-bounding-box labeling and actor-association tooling in Python."
    - id: uci-scalesense.fact.8
      text: "Parallelized offline labeling, post-processing, and dataset QA."
    - id: uci-scalesense.fact.9
      text: "Evaluated radar-based perception models including PointNet and RadarGNN in PyTorch on generated datasets."
    - id: uci-scalesense.fact.10
      text: "Received UCI's Chancellor's Award for Excellence in Undergraduate Research."
  metrics:
    - id: uci-scalesense.metric.1
      kind: count
      text: "Generated and analyzed approximately 1.85 million radar returns."
    - id: uci-scalesense.metric.2
      kind: absolute
      text: "Achieved approximately 87% oriented-bounding-box radar-labeling precision."
    - id: uci-scalesense.metric.3
      kind: absolute
      text: "Processed approximately 3,000 radar returns per second offline."
    - id: uci-scalesense.metric.4
      kind: count
      text: "Supported configurable layouts containing 4, 8, 12, or 14 radars."
  bullets:
    - id: uci-scalesense.bullet.1
      text: "Designed ScaleSense end-to-end: radar layouts, CARLA/SUMO capture, labeling, and campaign tooling in Python."
      sources: [uci-scalesense.fact.1, uci-scalesense.fact.3]
    - id: uci-scalesense.bullet.2
      text: "Fixed CARLA tick race conditions with synchronous ticks so multi-radar, camera, and SUMO frames stay aligned."
      sources: [uci-scalesense.fact.4, uci-scalesense.fact.5]
    - id: uci-scalesense.bullet.3
      text: "Configured 4/8/12/14-radar CARLA campaigns to test roadside placements for more optimal radar coverage."
      sources: [uci-scalesense.fact.2, uci-scalesense.fact.6, uci-scalesense.metric.4]
    - id: uci-scalesense.bullet.4
      text: "Evaluated PointNet and RadarGNN in PyTorch on ScaleSense datasets spanning ~1.85M radar returns."
      sources: [uci-scalesense.fact.9, uci-scalesense.metric.1]
