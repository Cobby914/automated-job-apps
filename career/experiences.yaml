- id: mk-lending
  company: M.K Lending
  role: Software Engineer Intern
  location: Brea, CA
  start: Aug. 2024
  end: Dec. 2025
  tracks: [swe, ai, default]
  tags: [backend, frontend, intern, apis, data-pipeline, dashboard]
  domains: [fintech, mortgage]
  technologies:
    - TypeScript
    - Node.js
    - React
    - Python
    - pandas
    - PostgreSQL
    - REST APIs
  summary: >
    Built internal software and data-automation systems for mortgage/loan workflows
    using TypeScript, Node.js, React, Python, pandas, PostgreSQL, and REST APIs.
    Developed a loan-lookup API and interface that automated calculations previously
    requiring substantial manual employee effort, a Python rate-sheet ingestion
    pipeline that parsed and loaded rate information into PostgreSQL, and dashboards
    that gave managers centralized visibility into employee loan activity.
  facts:
    - id: mk-lending.fact.1
      text: Built internal software and data-automation systems for mortgage/loan workflows using TypeScript, Node.js, React, Python, pandas, PostgreSQL, and REST APIs.
    - id: mk-lending.fact.2
      text: Developed a loan-lookup API and interface that automated calculations previously requiring substantial manual employee effort.
    - id: mk-lending.fact.3
      text: Created a Python rate-sheet ingestion pipeline that parsed and transformed incoming rate information before loading it into PostgreSQL.
    - id: mk-lending.fact.4
      text: Built dashboards that gave managers centralized visibility into employee loan activity rather than requiring information to be gathered manually from separate sources.
  metrics:
    - id: mk-lending.metric.1
      text: Reduced manual loan calculations by approximately 4 hours per day.
    - id: mk-lending.metric.2
      text: Automated rate-sheet processing, saving approximately 3 hours.
    - id: mk-lending.metric.3
      text: Dashboard supported 5+ managers.
  bullets:
    - id: mk-lending.bullet.1
      text: Built a loan-lookup REST API using TypeScript and Node.js, reducing manual calculations by 4 hours per day.
      sources: [mk-lending.fact.2, mk-lending.metric.1]
    - id: mk-lending.bullet.2
      text: Made a Python/pandas rate-sheet pipeline with PostgreSQL, saving approximately 3 hours of processing time.
      sources: [mk-lending.fact.3, mk-lending.metric.2]
    - id: mk-lending.bullet.3
      text: Created a dashboard tracking employee loans using React, PostgreSQL, and TypeScript for 5+ managers.
      sources: [mk-lending.fact.4, mk-lending.metric.3]
    - id: mk-lending.bullet.4
      text: Built role-based loan views for 5+ managers using React and PostgreSQL, improving internal workflow visibility.
      sources: [mk-lending.fact.4, mk-lending.metric.3]

