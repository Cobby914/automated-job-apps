- id: uci-scalesense
  company: University of California, Irvine
  role: Research Assistant
  location: Irvine, CA
  start: Dec. 2025
  end: Present
  tracks: [ai]
  tags: [research, autonomy, perception, simulation, ml, datasets]
  domains: [autonomous-driving, computer-vision, robotics]
  technologies:
    - CARLA
    - Python
    - PyTorch
    - Linux/Unix
    - Radar
    - Camera/Radar Sensor Fusion
    - PointNet
    - RadarGNN
    - Dataset QA
    - Computer Vision
    - Deep Learning
    - Multimodal Learning
  summary: >
    Conducting research on multimodal autonomous-driving perception using CARLA,
    radar, cameras, Python, PyTorch, and Linux. Built an end-to-end simulation and
    dataset-generation framework for evaluating infrastructure-mounted radar-camera
    configurations, including configurable 4/8/12/14-radar layouts, synchronized
    radar-camera captures, offline labeling/QA, and evaluation of PointNet and
    RadarGNN. Research received UCI's Chancellor's Award for Excellence in
    Undergraduate Research.
  facts:
    - id: uci-scalesense.fact.1
      text: Conducting research on multimodal autonomous-driving perception using CARLA, radar, cameras, Python, PyTorch, and Linux.
    - id: uci-scalesense.fact.2
      text: Built an end-to-end simulation and dataset-generation framework for evaluating infrastructure-mounted radar-camera configurations under controlled traffic scenarios.
    - id: uci-scalesense.fact.3
      text: Developed configurable 4-, 8-, 12-, and 14-radar layouts and synchronized radar detections, camera frames, vehicle metadata, 3D bounding boxes, and sensor calibration through CARLA's synchronous simulation environment.
    - id: uci-scalesense.fact.4
      text: Built offline labeling and QA pipelines to associate radar returns with simulated actors, analyze sensor coverage and point density, and identify labeling or dataset-quality failures without rerunning simulations.
    - id: uci-scalesense.fact.5
      text: Used generated datasets to evaluate radar-based perception approaches including PointNet and RadarGNN.
    - id: uci-scalesense.fact.6
      text: Research received UCI's Chancellor's Award for Excellence in Undergraduate Research.
  metrics:
    - id: uci-scalesense.metric.1
      text: Generated/analyzed approximately 1.85 million radar returns.
    - id: uci-scalesense.metric.2
      text: Supported configurable 4 / 8 / 12 / 14-radar layouts.
    - id: uci-scalesense.metric.3
      text: QA/offline processing reached roughly 3,000 radar returns/sec.
    - id: uci-scalesense.metric.5
      text: OBB-based radar labeling reached approximately 87% precision.
  bullets:
    - id: uci-scalesense.bullet.1
      text: Researching a multi-modal perception system fusing camera and radar data in CARLA simulations.
      sources: [uci-scalesense.fact.1]
    - id: uci-scalesense.bullet.2
      text: Evaluating PointNet and RadarGNN in PyTorch for radar-based perception on generated datasets.
      sources: [uci-scalesense.fact.5]
    - id: uci-scalesense.bullet.3
      text: Engineered a CARLA pipeline to create a synchronized radar-camera dataset with labels and geometric metadata.
      sources: [uci-scalesense.fact.2, uci-scalesense.fact.3]
    - id: uci-scalesense.bullet.4
      text: Generated labeled radar-camera captures across 4/8/12/14-radar layouts with ~1.85M returns.
      sources: [uci-scalesense.metric.1, uci-scalesense.metric.2]
    - id: uci-scalesense.bullet.5
      text: Implemented OBB-based radar labeling with 87% precision, exporting labels and sensor extrinsics for training.
      sources: [uci-scalesense.fact.4, uci-scalesense.metric.5]

